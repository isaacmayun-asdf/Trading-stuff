<title>Trading, from zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#F3F4F6;--body:#E3E5E9;--mute:#A9AEB8;--line:rgba(255,255,255,.12);--up:#4BE0A8;--down:#FF7B75;--acc:#C9F26B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#0B0C0E!important;color-scheme:dark}
body{margin:0;background:#0B0C0E!important;color:var(--body);font:400 16px/1.55 'Manrope',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-text-size-adjust:100%}
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(75% 42% at 8% 0%,rgba(255,255,255,.17),transparent 70%),radial-gradient(70% 40% at 100% 100%,rgba(255,255,255,.10),transparent 70%),linear-gradient(168deg,#383A3F 0%,#1A1B1E 38%,#0B0C0E 100%)}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
h1{font-size:38px;line-height:1.04;letter-spacing:-.035em;font-weight:300;margin:0;color:var(--ink)}
h2{font-size:27px;line-height:1.12;letter-spacing:-.025em;font-weight:600;margin:0 0 14px;color:var(--ink)}
p{margin:0 0 12px;max-width:62ch}
ul,ol{padding-left:20px;margin:0 0 12px}li{margin-bottom:6px}
b{font-weight:700;color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* smoky glass surface: opaque enough to stay readable on any backdrop */
.glass,.chart,.w,.opt,.mods,.nav div{
 background:radial-gradient(120% 90% at 12% 0%,rgba(255,255,255,.15),rgba(255,255,255,0) 58%),linear-gradient(155deg,#4A4C52 0%,#26272B 52%,#1C1D20 100%);
 border:1px solid rgba(255,255,255,.14);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.26),inset 0 -10px 24px rgba(0,0,0,.18),0 22px 44px rgba(0,0,0,.5)}
.replay,.chips button{background:linear-gradient(155deg,#34363B,#222327);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}

/* home */
.hero{padding:calc(env(safe-area-inset-top) + 26px) 20px 8px}
.brand{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.logo{width:84px;height:84px;border-radius:26px;overflow:hidden;position:relative;flex:none;box-shadow:0 18px 38px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.22)}
.logo img{width:100%;height:100%;display:block;object-fit:cover}
.logo::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,rgba(255,255,255,.42) 0%,rgba(255,255,255,.06) 36%,rgba(255,255,255,0) 58%,rgba(255,255,255,.14) 100%);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.38),inset 0 2px 7px rgba(255,255,255,.3);pointer-events:none}
.hero .strip{margin:0 -20px 10px}
.hero p{color:var(--mute);font-size:17px}
.mods{list-style:none;margin:12px 20px 0;padding:4px 20px;border-radius:30px}
.mods li{margin:0}
.mods a{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.mods li:last-child a{border-bottom:0}
.mods .n{font-size:30px;font-weight:300;letter-spacing:-.03em;width:38px;color:var(--mute)}
.mods .t{flex:1;line-height:1.25;font-weight:600;font-size:17px;color:var(--ink)}
.mods small{display:block;font-weight:400;color:var(--mute);font-size:14px;margin-top:3px}
.mods .ok{width:26px;height:26px;border-radius:50%;background:var(--acc);color:#10140A;display:grid;place-items:center;font-size:15px;font-weight:800;flex:none}
.mods .go{color:var(--mute);font-size:22px}
.sub{padding:28px 26px 0;font-weight:600;font-size:19px;letter-spacing:-.01em;color:var(--ink)}
.foot{padding:26px 26px calc(env(safe-area-inset-bottom) + 30px);color:var(--mute);font-size:13.5px;margin-top:auto}

/* shell */
.top{position:sticky;top:0;z-index:5;background:rgba(11,12,14,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
.back{border:0;background:none;font-size:30px;line-height:1;padding:0 8px 4px;color:var(--ink)}
.seg{flex:1;display:flex;gap:4px}
.seg i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.16)}
.seg i.d{background:rgba(243,244,246,.85)}.seg i.c{background:var(--acc)}
.scr{padding:18px 20px 124px;flex:1}
.nav{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(env(safe-area-inset-bottom) + 12px);pointer-events:none}
.nav div{pointer-events:auto;max-width:528px;margin:0 auto;display:flex;gap:8px;padding:8px;border-radius:999px}
.btn{flex:1;min-height:50px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:linear-gradient(155deg,#2F3135,#1D1E21);font-weight:600;font-size:16px;color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.btn.pri{background:linear-gradient(170deg,#FBFBFC 0%,#C9CCD3 100%);border-color:#fff;color:#0E0F12;box-shadow:inset 0 1px 0 #fff,0 6px 18px rgba(0,0,0,.35)}
.btn.sm{flex:none;padding:0 20px;min-height:44px}
.btn.ghost{flex:none;padding:0 22px}

/* content */
.viz{margin:0 0 18px}.viz:empty{display:none}
.chart{position:relative;border-radius:22px;overflow:hidden;background:radial-gradient(120% 80% at 12% 0%,rgba(255,255,255,.08),rgba(255,255,255,0) 55%),#121316}
.chart.bare{background:none;border:0;border-radius:0;box-shadow:none}
svg{display:block;width:100%;height:auto}
.tx{font:600 10.5px 'Manrope',ui-sans-serif,system-ui,sans-serif;paint-order:stroke;stroke:#121316;stroke-width:3px;stroke-linejoin:round}
.rp{display:flex;justify-content:flex-end;margin-top:8px}
.replay{border-radius:999px;font-size:13px;padding:6px 15px;color:var(--body)}
.pop{animation:pop .5s ease-out}
@keyframes pop{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.pop{animation:none}}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 0}
.chips button{border-radius:999px;padding:8px 15px;font-size:14.5px;color:var(--ink)}
.chips button.on{background:linear-gradient(170deg,#FBFBFC,#C9CCD3);border-color:#fff;color:#0E0F12;font-weight:600;box-shadow:inset 0 1px 0 #fff}
.note{border-left:3px solid var(--acc);padding:6px 0 6px 12px;margin:14px 0;background:linear-gradient(90deg,rgba(201,242,107,.09),transparent)}
.warn{border-left-color:var(--down);background:linear-gradient(90deg,rgba(255,123,117,.10),transparent)}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px;margin:4px 0 12px}
.tbl td,.tbl th{padding:9px 8px 9px 0;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-weight:600;color:var(--mute)}
.w{border-radius:26px;padding:18px}
.w label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
.w label:first-child{margin-top:0}
.w input[type=number],.w input[type=text],.w textarea,.search{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid rgba(255,255,255,.16);border-radius:16px;background:#0E0F11;color:var(--ink);box-shadow:inset 0 2px 8px rgba(0,0,0,.5)}
.w input::placeholder,.search::placeholder{color:#737987}
input[type=range]{width:100%;accent-color:var(--acc);margin:4px 0}
.big{font-size:36px;font-weight:300;letter-spacing:-.03em;line-height:1.1;color:var(--ink)}
.out{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.out p{margin:0 0 6px}
.good{color:var(--up)}.bad{color:var(--down)}.mute{color:var(--mute)}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.chk i{flex:none;width:24px;height:24px;border-radius:8px;border:1.5px solid rgba(255,255,255,.5);display:grid;place-items:center;font-style:normal;color:#10140A;font-weight:800;font-size:15px;margin-top:1px;background:rgba(255,255,255,.05)}
.chk.on i{background:var(--acc);border-color:var(--acc)}
.opt{display:block;width:100%;text-align:left;border-radius:22px;padding:16px;margin:0 0 10px;font-size:16px;color:var(--ink)}
.opt.right{border-color:var(--up);background:linear-gradient(155deg,#1E5A44,#143828)}
.opt.wrong{border-color:var(--down);background:linear-gradient(155deg,#6A2B28,#3E1A18)}
.opt:disabled{cursor:default;color:var(--ink)}
.q{font-size:22px;font-weight:600;line-height:1.3;letter-spacing:-.015em;margin:6px 0 18px;color:var(--ink)}
.jr{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.gl dt{font-weight:600;margin-top:12px;color:var(--ink)}.gl dd{margin:0;color:var(--mute)}
.search{margin-bottom:6px}
.buy,.sell{flex:1;min-height:50px;border-radius:999px;font-weight:700;font-size:16px;color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}.buy{background:linear-gradient(155deg,#1E5A44,#143828);border:1px solid var(--up)}.sell{background:linear-gradient(155deg,#6A2B28,#3E1A18);border:1px solid var(--down)}.row2{display:flex;gap:10px}.row2>div{flex:1}
</style>
</head>

const fmt$=v=>(v<0?'-$':'$')+Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});

function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function mk(start,steps){let p=start;return steps.map(([m,uw=.5,dw=.5])=>{const o=p,c=p+m;p=c;return[o,Math.max(o,c)+uw,Math.min(o,c)-dw,c]})}
function gen(seed,n,start,drift,vol){const r=rng(seed);let p=start;const out=[];for(let i=0;i<n;i++){const d=typeof drift==='function'?drift(i):drift;const m=d+(r()-.5)*2*vol;const o=p,c=p+m;p=c;out.push([o,Math.max(o,c)+r()*vol*.8,Math.min(o,c)-r()*vol*.8,c])}return out}
const flip=c=>c.map(([o,h,l,k])=>[100-o,100-l,100-h,100-k]);
const flipNotes=ns=>ns.map(n=>{const m={...n};['y','y1','y2'].forEach(k=>{if(m[k]!=null)m[k]=100-m[k]});if(m.pos)m.pos=m.pos==='above'?'below':'above';return m});
const sma=(a,p)=>a.map((_,i)=>i<p-1?null:a.slice(i-p+1,i+1).reduce((x,y)=>x+y,0)/p);
function rsi(cl,p=14){const out=Array(cl.length).fill(null);let g=0,l=0;for(let i=1;i<=p;i++){const d=cl[i]-cl[i-1];if(d>0)g+=d;else l-=d}g/=p;l/=p;out[p]=100-100/(1+g/(l||1e-9));for(let i=p+1;i<cl.length;i++){const d=cl[i]-cl[i-1];g=(g*(p-1)+(d>0?d:0))/p;l=(l*(p-1)+(d<0?-d:0))/p;out[i]=100-100/(1+g/(l||1e-9))}return out}
function atr(c,p=14){const tr=c.map((k,i)=>i?Math.max(k[1]-k[2],Math.abs(k[1]-c[i-1][3]),Math.abs(k[2]-c[i-1][3])):k[1]-k[2]);return tr.slice(-p).reduce((a,b)=>a+b,0)/p}
function chips(labels,active,cb){const d=el('<div class="chips"></div>');labels.forEach((t,i)=>{const b=el(`<button type="button" class="${i===active?'on':''}">${t}</button>`);b.onclick=()=>{[...d.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');cb(i)};d.append(b)});return d}

function chart(host,o){
  const W=340,H=o.h||210,P={l:8,r:8,t:16,b:14};
  const C=o.candles,n=C.length,slots=n+(o.extra||0),notes=o.notes||[];
  let lo=Math.min(...C.map(k=>k[2])),hi=Math.max(...C.map(k=>k[1]));
  notes.forEach(a=>[a.y,a.y1,a.y2].forEach(v=>{if(v!=null){lo=Math.min(lo,v);hi=Math.max(hi,v)}}));
  const sp=(hi-lo)||1;lo-=sp*.1;hi+=sp*.13;
  const st=(W-P.l-P.r)/slots,bw=Math.max(2.4,st*.62);
  const X=i=>P.l+st*(i+.5),Y=v=>P.t+(H-P.t-P.b)*(1-(v-lo)/(hi-lo));
  const mas=(o.ma||[]).map(m=>sma(C.map(k=>k[3]),m.period));
  const animated=!o.static&&!reduce&&n>1;
  host.innerHTML=`<div class="chart ${o.bare?'bare':''}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.alt||'Price chart'}"></svg></div>${animated&&!o.bare?'<div class="rp"><button class="replay" type="button">Replay</button></div>':''}`;
  const svg=$('svg',host);
  const an=x=>x<45?'start':x>W-45?'end':'middle';
  function draw(k,fresh){
    let s='';
    if(!o.bare)for(let g=1;g<5;g++){const y=P.t+(H-P.t-P.b)*g/5;s+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.06)"/>`}
    notes.forEach(a=>{if(a.type!=='zone'||k<(a.at??1))return;
      const x1=X(a.x1)-st/2,x2=a.x2==='end'?W-P.r:X(a.x2)+st/2,top=Y(Math.max(a.y1,a.y2)),bot=Y(Math.min(a.y1,a.y2)),col=a.color||ACC;
      s+=`<g class="${a.at===k&&fresh?'pop':''}"><rect x="${x1}" y="${top}" width="${x2-x1}" height="${bot-top}" fill="${col}" opacity=".14"/>${a.label?`<text x="${x1+4}" y="${top+11}" class="tx" fill="${col}">${a.label}</text>`:''}</g>`});
    for(let i=0;i<Math.min(k,n);i++){
      const [op,h,l,cl]=C[i],col=cl>=op?UPC:DNC,x=X(i);
      s+=`<line x1="${x}" x2="${x}" y1="${Y(h)}" y2="${Y(l)}" stroke="${col}" stroke-width="1.4"/><rect x="${x-bw/2}" y="${Y(Math.max(op,cl))}" width="${bw}" height="${Math.max(1.2,Math.abs(Y(op)-Y(cl)))}" fill="${col}" rx="1"/>`;
    }
    mas.forEach(v=>{const pts=[];for(let i=0;i<Math.min(k,n);i++)if(v[i]!=null)pts.push(X(i)+','+Y(v[i]));if(pts.length>1)s+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${ACC}" stroke-width="1.9" stroke-linejoin="round"/>`});
    notes.forEach(a=>{
      if(a.type==='zone'||k<(a.at??1))return;
      const cls=(a.at===k&&fresh)?'pop':'',col=a.color||INK;
      if(a.type==='hline'){const y=Y(a.y);s+=`<g class="${cls}"><line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="${col}" stroke-dasharray="${a.dash||'5 4'}" stroke-width="1.2"/><text x="${W-P.r-2}" y="${y-4}" text-anchor="end" class="tx" fill="${col}">${a.label||''}</text></g>`}
      else if(a.type==='vline'){const x=X(a.i);s+=`<g class="${cls}"><line x1="${x}" x2="${x}" y1="${P.t}" y2="${H-P.b}" stroke="${col}" stroke-dasharray="4 4"/><text x="${x-4}" y="${P.t+8}" text-anchor="end" class="tx" fill="${col}">${a.label||''}</text></g>`}
      else if(a.type==='line'){s+=`<g class="${cls}"><line x1="${X(a.i1)}" y1="${Y(a.y1)}" x2="${X(a.i2)}" y2="${Y(a.y2)}" stroke="${col}" stroke-width="1.4" stroke-dasharray="4 3"/></g>`}
      else if(a.type==='dot'){const x=X(a.i),y=Y(a.y);s+=`<g class="${cls}"><circle cx="${x}" cy="${y}" r="4.6" fill="${col}" stroke="#121316" stroke-width="1.6"/>${a.label?`<text x="${x}" y="${a.pos==='above'?y-9:y+17}" text-anchor="${an(x)}" class="tx" fill="${col}">${a.label}</text>`:''}</g>`}
      else if(a.type==='label'){const kk=C[a.i],base=a.y!=null?a.y:(a.pos==='below'?kk[2]:kk[1]),x=X(a.i),ty=a.pos==='below'?Y(base)+14:Y(base)-7;s+=`<g class="${cls}"><text x="${x}" y="${ty}" text-anchor="${an(x)}" class="tx" fill="${col}">${a.text}</text></g>`}
    });
    svg.innerHTML=s;
  }
  let timer=null,cur=0;
  function play(){clearInterval(timer);cur=o.from||1;draw(cur,true);timer=setInterval(()=>{cur++;if(cur>n){clearInterval(timer);return}draw(cur,true)},o.speed||420)}
  if(animated){play();onLeave(()=>clearInterval(timer));const r=$('.replay',host);if(r)r.onclick=play}else draw(n,false);
}

    $('#nv',box).textContent=n;$('#pv',box).textContent=Math.round(p*100);
    const X=v=>10+300*(v-.2)/.7;
    $('#bar',box).innerHTML=`<line x1="10" x2="310" y1="30" y2="30" stroke="rgba(255,255,255,.2)" stroke-width="2"/><rect x="${X(Math.max(a,.2))}" y="22" width="${Math.max(2,X(Math.min(b,.9))-X(Math.max(a,.2)))}" height="16" fill="${a>.5?UPC:ACC}" rx="4" opacity=".85"/><line x1="${X(.5)}" x2="${X(.5)}" y1="12" y2="48" stroke="${INK}" stroke-width="2"/><text x="${X(.5)}" y="9" text-anchor="middle" class="tx" fill="${INK}">50%</text>`;
    $('#o',box).innerHTML=`<p>Your true win rate is probably somewhere between <b>${Math.round(a*100)}% and ${Math.round(b*100)}%</b>.</p><p class="${a>.5?'good':'bad'}">${a>.5?'The whole range sits above 50%, which is the first sign of a real edge for a 1 to 1 system (before costs).':'The range includes 50%, so this result cannot be told apart from luck.'}</p>`};
  $('#n',box).oninput=up;$('#p',box).oninput=up;up();
}

function W_over(box){
  box.innerHTML=`<div class="w"><div class="chart"><svg id="sv" viewBox="0 0 340 200"></svg></div><div style="margin-top:12px"><button class="btn pri sm" id="run" type="button">Test 20 useless strategies</button></div><div class="out" id="o"><p class="mute">Every strategy here is a coin flip: win 1R or lose 1R, 100 trades.</p></div></div>`;
  $('#run',box).onclick=()=>{const runs=[];for(let j=0;j<20;j++){let r=0;const pts=[0];for(let i=0;i<100;i++){r+=Math.random()<.5?1:-1;pts.push(r)}runs.push(pts)}
    const ends=runs.map(p=>p[100]),bi=ends.indexOf(Math.max(...ends)),lo=Math.min(...runs.flat()),hi=Math.max(...runs.flat());
    const Y=v=>10+180*(1-(v-lo)/(hi-lo)),X=i=>6+i*(328/100);
    let s=`<line x1="0" x2="340" y1="${Y(0)}" y2="${Y(0)}" stroke="#7684A0" stroke-dasharray="4 4"/>`;
    runs.forEach((p,j)=>{if(j!==bi)s+=`<polyline points="${p.map((v,i)=>X(i)+','+Y(v)).join(' ')}" fill="none" stroke="#586480" stroke-width="1.2"/>`});
    s+=`<polyline points="${runs[bi].map((v,i)=>X(i)+','+Y(v)).join(' ')}" fill="none" stroke="${ACC}" stroke-width="2.6"/>`;
    $('#sv',box).innerHTML=s;
    $('#o',box).innerHTML=`<p>The best one finished <b class="good">+${ends[bi]} R</b>. It looks like a system. It is pure luck, and it is exactly the one you would have picked.</p>`};
}

const MODS=[
{t:'How trading works',min:8,sub:'Pips, lots, spread, leverage, sizing',screens:[
 {t:'You are betting on direction',viz:b=>chart(b,{candles:mk(40,[[1],[-1.5],[2,1,.5],[2.5,.5,1],[1.5],[3],[-1,1.5],[3,1],[2.5,.5,1],[-1.5,1],[3.5,1],[2]]),h:220,speed:450,alt:'A buy trade that closes in profit',notes:[{type:'zone',x1:2,x2:10,y1:41.5,y2:55,at:11,label:'Profit'},{type:'dot',i:2,y:41.5,at:3,color:ACC,label:'Buy',pos:'below'},{type:'dot',i:10,y:55,at:11,color:ACC,label:'Close the trade',pos:'above'}]}),
  html:`<p>A trade is a bet that price will rise (you <b>buy</b>, also called going long) or fall (you <b>sell</b>, going short). When you close it, the difference between your entry and exit price is your profit or loss.</p><p>With forex, gold and index CFDs you never own the asset. Your broker credits or debits you the price difference, nothing more.</p>`},
 {t:'Pips and lots',viz:W_pips,html:`<p>A <b>pip</b> is the standard small price step: the fourth decimal on most pairs (0.0001). A <b>lot</b> is trade size.</p><table class="tbl"><tr><th>Size</th><th>EURUSD, per pip</th></tr><tr><td>1.00 lot</td><td>about $10</td></tr><tr><td>0.10 lot</td><td>about $1</td></tr><tr><td>0.01 lot</td><td>about $0.10</td></tr></table><p>Gold is different: 1.00 lot is usually 100 ounces, so a $1 move in gold is $100 per lot, or $1 at 0.01 lot.</p><p class="note">Contract sizes vary by broker and symbol. In MT5, right-click a symbol in Market Watch and open Specification before you size anything.</p>`},
 {t:'Spread: the toll on every trade',viz:b=>chart(b,{candles:mk(50,[[.5],[-.3],[.4],[-.2],[.3],[.2],[-.1]]),static:true,extra:2,h:200,notes:[{type:'zone',x1:0,x2:'end',y1:50.45,y2:51.15,label:'Spread: your instant cost'},{type:'hline',y:51.15,label:'Ask: you buy here',color:DNC},{type:'hline',y:50.45,label:'Bid: you sell here',color:UPC}]}),
  html:`<p>Every market has two prices. You <b>buy at the ask</b> and <b>sell at the bid</b>, and the ask is higher. The gap is the spread, so every trade starts slightly in the red.</p><p>If your target is 10 pips and the spread is 1.5, the spread has already taken 15% of it. Spreads widen during news, around the daily rollover at 5 pm New York, and in thin markets.</p>`},
 {t:'Leverage and margin',viz:W_lev,html:`<p><b>Margin</b> is the deposit your broker locks up to hold a trade. <b>Leverage</b> sets how little margin you need. High leverage does not make you richer; it lets you open trades far too big for your account.</p>`},
 {t:'Size every trade from the stop',viz:W_calc,html:`<p>Decide where you are wrong first (the stop), then let the stop distance and your risk budget set the size. Never pick a lot size first and hope.</p>`}],
 quiz:[
 {q:'You buy EURUSD at 0.10 lot and price rises 20 pips. Roughly what do you make?',o:['$2','$20','$200','$2,000'],a:1,why:'0.10 lot is about $1 per pip, so 20 pips is about $20.'},
 {q:'What does higher leverage change?',o:['How much profit each pip makes','How much margin a trade needs','The spread','How often price moves'],a:1,why:'Pip value depends on lot size. Leverage only changes the margin required, and so how big a trade you can open.'},
 {q:'You risk $10 on EURUSD with a 25 pip stop. What lot size fits?',o:['0.01','0.04','0.25','0.40'],a:1,why:'$10 ÷ (25 pips × $10 per pip per lot) = 0.04 lots.'}]},

{t:'Reading candles',min:6,sub:'Anatomy, timeframes, wicks, context',screens:[
 {t:'A candle summarises a time period',viz:W_form,html:`<p>Each candle records four prices for one period: <b>open, high, low, close</b>. The body runs from open to close. The thin wicks reach the high and the low.</p><p>Green means it closed above its open. Red means it closed below.</p>`},
 {t:'Timeframes: same market, new zoom',viz:b=>{const base=gen(5,24,50,.12,1.2),agg=k=>{const out=[];for(let i=0;i<base.length;i+=k){const g=base.slice(i,i+k);out.push([g[0][0],Math.max(...g.map(x=>x[1])),Math.min(...g.map(x=>x[2])),g[g.length-1][3]])}return out};const hold=el('<div></div>');const draw=i=>chart(hold,{candles:agg([1,3,6][i]),static:true,h:200,alt:'The same prices at different timeframes'});b.append(hold,chips(['5-minute','15-minute','30-minute'],0,draw));draw(0)},
  html:`<p>Tap through the three views. It is the same price action; only the zoom changed. Zoomed out, noise fades and the trend is easier to see.</p><p>Higher timeframes (4-hour, daily) are slower but more reliable. Most traders decide direction and levels there, then drop to a lower timeframe only to time the entry.</p>`},
 {t:'What bodies and wicks tell you',viz:b=>chart(b,{candles:mk(50,[[1],[-1],[8,.2,.2],[-1],[.8],[.1,3,3],[-1],[1],[.8,.3,5],[2],[1]]),static:true,h:220,notes:[{type:'label',i:2,pos:'above',text:'Strong body',color:UPC},{type:'label',i:5,pos:'above',text:'Doji',color:MUTE},{type:'label',i:8,pos:'below',text:'Long lower wick',color:ACC}]}),
  html:`<ul><li><b>Big body, tiny wicks:</b> one side controlled the whole period.</li><li><b>Tiny body, wicks both sides (doji):</b> a tug of war with no winner.</li><li><b>Long wick:</b> price went there and was pushed back. That is rejection.</li></ul>`},
 {t:'Candles only matter in context',viz:b=>chart(b,{candles:mk(60,[[2],[2.5],[1.5,.5,1],[2],[2,3.4,.5],[1,2.5,.5],[-3,1],[-2.5,.5,1],[-1.5],[-3,.5,1]]),h:220,speed:480,notes:[{type:'hline',y:73.5,at:6,label:'Level that held before',color:MUTE},{type:'label',i:5,pos:'above',text:'Long upper wick',at:6,color:DNC}]}),
  html:`<p>A long wick in the middle of nowhere is noise. The same wick at a level that has already stopped price before is information. Always ask <b>where</b> a candle formed, not only what it looks like.</p>`}],
 quiz:[
 {q:'A candle has a small body near its low and a very long upper wick. What happened?',o:['Buyers dominated','Buyers pushed up but sellers rejected the high','Nothing, it is a doji','The market was closed'],a:1,why:'The long upper wick shows price rose and was rejected, then closed near the bottom.'},
 {q:'A bullish candle is one that…',o:['has a long lower wick','closes above its open','is bigger than the last one','forms on a daily chart'],a:1,why:'Colour only encodes whether the close is above or below the open.'},
 {q:'Why look at higher timeframes first?',o:['They make bigger profits per trade','They filter noise and show the real trend and levels','They remove the spread','They are faster'],a:1,why:'Higher timeframes smooth out noise, so direction and key levels are clearer.'}]},

{t:'Market structure',min:7,sub:'Trends, ranges, breaks, pullbacks',screens:[
 {t:'Trends are staircases',viz:trendViz,html:`<p>An <b>uptrend</b> makes higher highs (HH) and higher lows (HL). A <b>downtrend</b> makes lower highs (LH) and lower lows (LL). Neither: a range.</p><p>A swing high is a peak with lower highs on both sides. A swing low is the mirror image. Trends are just the sequence of these swings.</p>`},
 {t:'When structure breaks',viz:b=>chart(b,{candles:BOS,h:230,speed:380,notes:[{type:'hline',y:58,at:10,label:'Last higher low',color:UPC},{type:'dot',i:16,y:57.5,at:17,color:DNC,label:'Close below: structure broken',pos:'below'}]}),
  html:`<p>In an uptrend, the last higher low is the line the buyers must defend. A candle <b>closing</b> below it is the first sign the trend may be over.</p><p>It is a warning, not a reversal. Stop looking for buys and wait to see what price builds next.</p>`},
 {t:'Much of the time, price just ranges',viz:b=>chart(b,{candles:RNG,static:true,h:210,notes:[{type:'hline',y:59.5,label:'Range high',color:MUTE},{type:'hline',y:50.5,label:'Range low',color:MUTE}]}),
  html:`<p>Markets spend a lot of their time bouncing between a ceiling and a floor. Trend strategies lose money in ranges; range strategies lose money when a trend starts.</p><p>So the first question on any chart: trending or ranging?</p>`},
 {t:'Buy the pullback, not the top',viz:b=>chart(b,{candles:UP.slice(0,13),h:230,speed:430,notes:[{type:'dot',i:9,y:58.5,at:10,color:ACC,label:'Buy',pos:'above'},{type:'hline',y:57.2,at:10,label:'Stop: below the higher low',color:DNC},{type:'hline',y:63.5,at:10,label:'Target: previous high',color:UPC}]}),
  html:`<p>In an uptrend, wait for price to pull back toward the last higher low and show buyers returning. Your stop sits just beyond the swing that proves you wrong, so risk is small next to the reward.</p><p>Chasing a new high forces a far wider stop for the same target.</p>`}],
 quiz:[
 {q:'Price makes lower highs and lower lows. That is a…',o:['Uptrend','Downtrend','Range','Breakout'],a:1,why:'Lower highs plus lower lows define a downtrend.'},
 {q:'In an uptrend, price closes below the last higher low. What does that mean?',o:['Buy more','Structure broke: the trend is in doubt','The trend is stronger','Nothing'],a:1,why:'That close breaks the staircase. Stop buying until price shows what happens next.'},
 {q:'Why prefer pullback entries to buying at fresh highs?',o:['They never lose','Your stop can be much closer to the point where the idea fails','They avoid the spread','Higher highs are fake'],a:1,why:'A closer stop means better reward for the same risk.'}]},

{t:'Support, resistance, liquidity',min:7,sub:'Levels, order clusters, sweeps, fakeouts',screens:[
 {t:'Levels are zones, not lines',viz:b=>chart(b,{candles:ZONE,h:240,extra:2,speed:400,notes:[{type:'zone',x1:0,x2:'end',y1:68.5,y2:70.2,at:3,label:'Resistance zone'},{type:'label',i:2,pos:'above',text:'Rejected',at:3,color:DNC},{type:'label',i:7,pos:'above',text:'Rejected again',at:8,color:DNC},{type:'label',i:11,pos:'above',text:'Breakout',at:12,color:UPC},{type:'label',i:13,pos:'below',text:'Retest holds',at:14,color:UPC}]}),
  html:`<p><b>Support</b> is where price stopped falling before. <b>Resistance</b> is where it stopped rising. Draw them as bands that cover the wicks and bodies of earlier turns, not as one exact price.</p><p>When a resistance zone breaks and price returns to test it from above, it often turns into support.</p>`},
 {t:'Why levels work',viz:b=>{b.innerHTML=orderSvg},html:`<p>Orders cluster at obvious prices. Short sellers place stop-losses just above highs. Breakout traders place buy orders there too. This pool of orders is called <b>liquidity</b>.</p><p>Big players need many opposite orders to fill large trades, so price is often pulled toward those clusters.</p><p class="note">This is a popular explanation, not a proven law. Treat it as a way to read charts, then test it.</p>`},
 {t:'Liquidity sweeps',viz:b=>chart(b,{candles:SWEEP,h:230,speed:420,notes:[{type:'hline',y:56.7,at:7,label:'Equal highs: stops sit above',color:MUTE},{type:'dot',i:9,y:59,at:10,color:DNC,label:'Sweep',pos:'above'},{type:'label',i:10,pos:'below',text:'Closes back below',at:11,color:DNC}]}),
  html:`<p>Price pokes through an obvious high or low, triggers the stops resting there, then snaps back. It is called a liquidity sweep or stop hunt.</p><p>The tell is the <b>close</b>: the wick breaks the level but the candle closes back inside. You cannot know in advance, so wait for the close.</p>`},
 {t:'Real breakout or fakeout?',html:`<table class="tbl"><tr><th></th><th>Real breakout</th><th>Fakeout</th></tr><tr><td>Candle</td><td>Closes beyond the level</td><td>Wick only, closes back inside</td></tr><tr><td>Candle size</td><td>Big body, little wick</td><td>Long wick, small body</td></tr><tr><td>Next move</td><td>Retest holds the level</td><td>Price reverses fast</td></tr></table><p>The cheapest filter: wait for the candle to close beyond the level, and consider waiting for the retest. You miss some moves and dodge many traps.</p>`}],
 quiz:[
 {q:'When does old resistance often become support?',o:['Never','After price breaks above it and a retest holds','When RSI is high','On Mondays'],a:1,why:'A confirmed break plus a held retest is the classic role flip.'},
 {q:'What is a liquidity sweep?',o:['A very large candle','Price briefly breaks an obvious high or low, takes the stops, then closes back','A news spike','The spread widening'],a:1,why:'The wick takes the stops; the close returns inside the old range.'},
 {q:'Simplest way to avoid many fakeouts?',o:['Enter on the first touch','Wait for a candle to close beyond the level','Use more leverage','Trade smaller timeframes'],a:1,why:'A close beyond the level, ideally with a retest, filters most wick-only traps.'}]},

{t:'Fair value gaps and smart-money ideas',min:8,sub:'FVG, how it is traded, what is unproven',screens:[
 {t:'What a fair value gap is',viz:fvgViz,html:`<p>Look at three candles in a row. When the middle one moves so fast that candle 1's high and candle 3's low do not overlap, the space between them is a gap where price traded in only one direction.</p><p>Traders call it a <b>fair value gap</b> (FVG) or imbalance. Bearish is the mirror image: the gap sits between candle 1's low and candle 3's high.</p>`},
 {t:'How traders use it',viz:b=>chart(b,{candles:FVG,h:240,speed:480,notes:[{type:'zone',x1:2,x2:'end',y1:48.8,y2:52.1,at:5,label:'FVG'},{type:'dot',i:9,y:52.1,at:10,color:ACC,label:'Entry as price returns',pos:'below'},{type:'hline',y:48.4,at:10,label:'Stop below the gap',color:DNC},{type:'hline',y:57,at:10,label:'Target: recent high',color:UPC},{type:'label',i:11,pos:'above',text:'Target hit',at:12,color:UPC}]}),
  html:`<p>The theory: price tends to come back and fill part of the gap before continuing. The usual plan is to enter when price reaches the gap, stop beyond it, and target the recent swing.</p><p>Notice the reward is only slightly bigger than the risk here. Gap entries are not automatically high reward.</p>`},
 {t:'The honest part',html:`<p>FVGs form constantly, and price often returns to them simply because price wanders back and forth. There is no solid evidence that FVG entries beat chance on their own.</p><p>What traders say improves them:</p><ul><li>The gap agrees with the higher-timeframe trend.</li><li>It was created by a strong move that broke structure.</li><li>It formed right after a liquidity sweep.</li></ul><p class="note warn">These are hypotheses, not facts. You will test them properly in module 10. Until a rule has survived testing, risk very little on it.</p>`},
 {t:'Smart-money vocabulary',html:`<table class="tbl"><tr><th>Term</th><th>Plain meaning</th></tr><tr><td>Order block</td><td>The last opposite candle before a strong move. Said to mark where big orders sat.</td></tr><tr><td>Displacement</td><td>A strong, fast move that breaks structure.</td></tr><tr><td>BOS</td><td>Break of structure: trend continues past a swing.</td></tr><tr><td>CHoCH</td><td>Change of character: first break against the trend.</td></tr><tr><td>Mitigation</td><td>Price returning to a zone to "use up" its orders.</td></tr><tr><td>Premium / discount</td><td>Upper half / lower half of a range. Buy cheap, sell expensive.</td></tr></table><p>Same warning as FVG: popular, useful as a language for reading charts, unproven as a source of edge.</p>`}],
 quiz:[
 {q:'A bullish FVG exists when…',o:['Candle 3 low is above candle 1 high','Candle 2 is red','Three candles are the same size','Price touches a moving average'],a:0,why:'The unfilled space between candle 1 high and candle 3 low is the gap.'},
 {q:'Which statement about FVGs is most honest?',o:['Price always fills them','They are a hypothesis to test, not a proven edge','They only work on gold','They replace stop-losses'],a:1,why:'Evidence that FVG entries beat chance alone is thin. Test before trusting.'},
 {q:'A bearish FVG sits between…',o:['Candle 1 low and candle 3 high','Candle 2 open and close','Two support levels','The bid and the ask'],a:0,why:'Bearish is the mirror: candle 3 high stays below candle 1 low.'}]},

{t:'Indicators and top-down analysis',min:7,sub:'Moving average, RSI, ATR, timeframes',screens:[
 {t:'Moving average: the trend filter',viz:maViz,html:`<p>Every indicator is a formula applied to <b>past</b> candles, so they lag by design. They summarise; they do not predict.</p><p>A moving average is the average of the last N closes. Price above a rising line means uptrend. A bigger N is smoother but later. Use it to filter direction, not as an entry trigger.</p>`},
 {t:'RSI: momentum, not a sell button',viz:rsiViz,html:`<p>RSI scores recent gains against losses from 0 to 100. Above 70 is called overbought, below 30 oversold.</p><p>In a strong trend RSI can stay pinned for a long time, so overbought is not a reason to sell on its own. It is better at showing momentum fading: price makes a new high but RSI does not (divergence).</p>`},
 {t:'ATR: how far price normally moves',viz:atrViz,html:`<p><b>ATR</b> (average true range) is the average size of a candle's full range. Set your stop outside normal noise, often 1 to 2 times ATR, then size the trade from that stop.</p><p>A stop inside normal candle range gets hit by noise even when your idea is right.</p>`},
 {t:'Top-down: start big, finish small',html:`<table class="tbl"><tr><th>Timeframe</th><th>Job</th></tr><tr><td>Daily / 4-hour</td><td>Direction, key levels</td></tr><tr><td>1-hour</td><td>Where the setup forms</td></tr><tr><td>15 / 5-minute</td><td>Timing the entry</td></tr></table><p>Trade only when the timeframes agree. Skipping the top row is the most common reason beginners end up trading against the real trend.</p>`}],
 quiz:[
 {q:'Why are moving averages called lagging?',o:['They use past prices','They are slow to load','They only work on daily charts','They ignore volume'],a:0,why:'They are calculated from past closes, so they confirm moves after they start.'},
 {q:'RSI reads 85 in a strong uptrend. Best interpretation?',o:['Sell immediately','Strong momentum; not a sell signal alone','The data is broken','Price must fall to 50 next'],a:1,why:'RSI can stay overbought through long trends.'},
 {q:'Why base the stop on ATR?',o:['To make losses bigger','To keep the stop outside normal noise','To avoid the spread','It is required by brokers'],a:1,why:'A stop within normal candle range is hit by noise, not by being wrong.'}]},

{t:'News and sessions',min:5,sub:'Events, spikes, when to stay flat',screens:[
 {t:'Scheduled events move price',html:`<p>Prices react to the gap between what was expected and what was released. A number that matches expectations barely moves price. A surprise moves it fast.</p><table class="tbl"><tr><th>Event</th><th>When</th></tr><tr><td>US jobs report (NFP)</td><td>First Friday of the month, 8:30 am New York</td></tr><tr><td>US inflation (CPI)</td><td>Monthly, 8:30 am New York</td></tr><tr><td>Fed rate decision (FOMC)</td><td>About 8 times a year, 2:00 pm New York</td></tr><tr><td>ECB, BoE, BoJ decisions</td><td>Scheduled, check the calendar</td></tr></table><p>Gold and USD pairs feel US events most. Surprises like geopolitics or speeches arrive unannounced.</p>`},
 {t:'What a news candle looks like',viz:b=>chart(b,{candles:NEWS,h:220,speed:520,notes:[{type:'vline',i:6,at:7,label:'News released',color:MUTE},{type:'label',i:7,pos:'below',text:'Spike down',at:8,color:DNC}]}),
  html:`<p>Quiet candles, then both directions inside minutes. Spreads widen, stops fill far from where you set them (slippage), and entries get chopped in the whipsaw.</p>`},
 {t:'Three ways to handle it',html:`<ol><li><b>Stay flat.</b> No open trades, no new ones, from 15 to 30 minutes before to 15 minutes after. The beginner default.</li><li><b>Wait for structure.</b> Let the spike finish, then trade the new structure after spreads normalise.</li><li><b>Trade the spike.</b> Fastest way to pay spread and slippage twice. Not for now.</li></ol><p>Each week, look only at the high-impact events on the calendar and mark them before you plan trades.</p>`},
 {t:'Sessions and your clock',html:`<p>EUR, GBP and USD pairs are quiet in the Asian session and busiest when London and New York overlap: roughly 1 pm to 5 pm London time. Fridays late in the day tend to thin out.</p><p class="note">Nigeria stays on UTC+1 all year. London and New York change clocks on different dates, so their times shift against your clock twice a year. Check session times on your platform instead of memorising them.</p>`}],
 quiz:[
 {q:'What usually happens to spreads at major news?',o:['They shrink','They widen','They stay the same','They vanish'],a:1,why:'Liquidity thins and spreads widen, which also causes slippage.'},
 {q:'Safest beginner approach to big news?',o:['Double your size','Stay flat around the release','Remove your stop','Trade the first candle'],a:1,why:'Staying flat avoids spread widening and whipsaws.'},
 {q:'How often does the Fed make rate decisions?',o:['Daily','About 8 times a year','Once a decade','Every Friday'],a:1,why:'FOMC meets about eight times per year.'}]},

{t:'Risk and expectancy',min:9,sub:'The part that decides if you survive',screens:[
 {t:'Risk a small, fixed percentage',html:`<p>Losing streaks are normal. With a 50% win rate you will usually meet a streak of five losses within 100 trades. The only question is how deep it cuts.</p><table class="tbl"><tr><th>Risk per trade</th><th>After 5 losses in a row</th></tr><tr><td>1%</td><td class="good">-4.9%</td></tr><tr><td>2%</td><td>-9.6%</td></tr><tr><td>5%</td><td class="bad">-22.6%</td></tr><tr><td>10%</td><td class="bad">-41%</td></tr></table><p>Risk 1% or less while you learn. It is the single most important decision you make.</p>`},
 {t:'Losses are harder to undo than gains',viz:W_dd,html:`<p>A 50% loss needs a 100% gain to repair. Deep drawdowns are the real way accounts end, so protect the downside first.</p>`},
 {t:'Expectancy: does it pay?',viz:W_exp,html:`<p><b>R</b> is your risk on one trade. Losing the full stop is -1R. Winning twice your risk is +2R. <b>Expectancy</b> is the average result per trade in R.</p><p>Try 1 to 1 at 50% with costs at 0.10: the average is negative. Costs turn a coin flip into a slow loss.</p>`},
 {t:'Luck is loud',viz:W_sim,html:`<p>Even with a real edge, outcomes scatter widely. Press the button a few times, then switch risk to 5% and watch the dips.</p>`}],
 quiz:[
 {q:'You lose 50% of your account. What gain restores it?',o:['50%','75%','100%','150%'],a:2,why:'Half of the original balance must double.'},
 {q:'A 1 to 1 strategy wins 50% of trades and has costs. Expectancy is…',o:['Positive','Zero','Negative','Impossible to know'],a:2,why:'Zero before costs; costs push it below zero.'},
 {q:'You risk 5% per trade and lose five in a row. Roughly how much is gone?',o:['5%','10%','23%','50%'],a:2,why:'0.95^5 ≈ 0.774, so about 22.6% is gone.'}]},

{t:'Plan, psychology, journal',min:6,sub:'Pre-trade checklist, habits, your own data',screens:[
 {t:'Write the plan before the trade',viz:W_check,html:`<p style="margin-top:14px">Tap each item as you honestly confirm it. If you cannot tick all seven, there is no trade. Decisions made before price moves are far calmer than ones made during.</p>`},
 {t:'Habits that drain accounts',html:`<ul><li><b>Revenge trading.</b> Doubling size to win back a loss. Rule: after two losses in a day, stop.</li><li><b>Moving the stop.</b> Turns a controlled -1R into an open-ended loss. Rule: stops only move toward profit.</li><li><b>Chasing.</b> Entering after the move left. Rule: if you missed it, wait for the next one.</li><li><b>Overtrading.</b> Boredom trades. Rule: a daily cap on trades.</li><li><b>Oversizing after wins.</b> Confidence inflates lots. Rule: size comes from the stop and 1% only.</li><li><b>Skipping the journal.</b> You remember your best trades and forget the rest.</li></ul>`},
 {t:'Your trade journal',viz:W_journal,html:`<p style="margin-top:14px">Record the setup name and result in R for every trade, including bad ones. After 30 trades, the numbers show what actually works for you.</p>`}],
 quiz:[
 {q:'You hit your stop and instantly double your lot to win it back. This is…',o:['Smart recovery','Revenge trading','Position sizing','Hedging'],a:1,why:'Bigger size after a loss is how small losses become account-ending ones.'},
 {q:'Why is moving your stop further away a bad idea?',o:['Brokers charge for it','It turns a defined loss into an open-ended one','Stops cannot move','It reduces the spread'],a:1,why:'The stop defines the idea\'s failure point. Moving it breaks your risk math.'},
 {q:'Main purpose of a journal?',o:['Impress others','Find patterns in your real results','Pay less tax','Replace the stop'],a:1,why:'Memory is biased. Recorded data shows what works.'}]},

{t:'Testing an edge',min:8,sub:'Sample size, overfitting, stages before real money',screens:[
 {t:'From idea to rules',html:`<p>An idea becomes testable when every part is unambiguous: what counts as the setup, where you enter, where the stop and target go, what size you trade. If another person could trade your rules and get the same trades, you can test them.</p><p>Vague ideas like "buy strong support" cannot be tested, which makes them easy to believe in forever.</p>`},
 {t:'How many trades is enough?',viz:W_ci,html:`<p>A small sample can look brilliant by luck. Slide trades up and watch the range shrink. Anything under about 100 trades tells you very little.</p>`},
 {t:'Overfitting: the best of many is luck',viz:W_over,html:`<p>If you try many settings and keep the one that looks best, you have probably found luck. The cure: write the rules before testing, test on data you did not tune on, and do not tweak after seeing results.</p>`},
 {t:'The stages before real money',html:`<ol><li><b>Backtest</b> on 200+ trades covering trends, ranges and news. Include spread and slippage.</li><li><b>Out-of-sample test</b> on data you never touched while designing.</li><li><b>Demo forward test</b> for at least 50 live trades, not 2 days.</li><li><b>Small live</b> at minimum size for another 50 trades. Real fills and real nerves.</li></ol><p><b>Weekly loop:</b> on Sunday mark levels and check the calendar. Every trade, journal it. After 30 new trades, review the stats and change one thing at most.</p><p class="note">Skipping stages is the most expensive way to learn.</p>`}],
 quiz:[
 {q:'30 trades, 60% wins. What can you conclude?',o:['A proven edge','Not much; it could be luck','The strategy is broken','Increase size'],a:1,why:'With 30 trades the range is wide and includes 50%.'},
 {q:'You test 50 settings and keep the best. Main risk?',o:['None','Overfitting: it may be pure luck','The spread','Margin call'],a:1,why:'Picking the best of many random results guarantees a flattering but false number.'},
 {q:'What comes right before small live trading?',o:['Nothing','A forward test on demo','Doubling lots','Removing stops'],a:1,why:'Demo forward testing of 50+ trades checks the rules on new data.'}]}
];

const GLOSS=[['Ask','Price you buy at.'],['Bid','Price you sell at.'],['Spread','Ask minus bid. Your instant cost per trade.'],['Pip','Standard small price step, usually the fourth decimal.'],['Lot','Trade size. 1.00 lot is 100,000 units of a currency pair.'],['Leverage','Lets you open trades bigger than your balance by using borrowed buying power.'],['Margin','Deposit locked while a trade is open.'],['Stop-out','Broker automatically closes trades when margin gets too thin.'],['Stop loss','Order that closes a trade at a set loss.'],['Take profit','Order that closes a trade at a set profit.'],['Limit order','Order to buy lower or sell higher than the current price.'],['Slippage','Getting filled at a worse price than requested.'],['Swap','Fee or credit for holding a position overnight.'],['Long / short','Betting price rises / falls.'],['Swing high / low','A peak or trough with lower / higher candles on both sides.'],['HH, HL, LH, LL','Higher high, higher low, lower high, lower low.'],['Range','Price bouncing between a floor and a ceiling.'],['Support / resistance','Zones where price has stopped falling / rising.'],['Retest','Price returns to a broken level to test it.'],['Liquidity','Clusters of orders, especially stops, around obvious highs and lows.'],['Sweep','Brief break of a high or low that takes stops, then reverses.'],['FVG','Gap between candle 1 and candle 3 left by a fast middle candle.'],['Order block','Last opposite candle before a strong move.'],['Displacement','Strong, fast move that breaks structure.'],['BOS / CHoCH','Break of structure with / against the trend.'],['Moving average','Average of the last N closes.'],['RSI','Momentum score from 0 to 100.'],['ATR','Average size of a candle\'s full range.'],['Drawdown','Fall from an account\'s peak.'],['R-multiple','Result measured in units of risk. -1R is a full stop.'],['Expectancy','Average result per trade in R.'],['Backtest','Applying rules to historical data.'],['Overfitting','Tuning rules to past data until they look good by chance.'],['Demo account','Practice account using fake money.']];


GLOSS.push(["Balance","Money in your account, not counting open trades."],["Equity","Balance plus or minus the profit or loss of open trades."],["Free margin","Equity minus the margin in use. What you have left to open new trades."],["Margin level","Equity divided by used margin, as a percentage. Brokers act when it gets too low."],["Margin call","Broker warning that margin level is low and you may soon be stopped out."],["Market order","Order to buy or sell immediately at the current price."],["Pending order","Order that waits and triggers at a price you choose."],["Buy stop / sell stop","Pending orders above / below the current price, used for breakouts."],["Trailing stop","A stop that follows price as the trade moves in your favour."],["Breakeven","Moving the stop to your entry so the trade can no longer lose (before costs)."],["Partial close","Closing part of a position and leaving the rest open."],["Risk-reward ratio","Potential profit divided by risk. A 2:1 trade targets twice the stop distance."],["Win rate","Percentage of trades that make money."],["Profit factor","Total profit divided by total loss. Above 1 means profitable overall."],["Maximum drawdown","Largest peak-to-trough fall in an account or a test."],["Equity curve","Chart of your account value over time."],["Position sizing","Choosing trade size from your risk budget and stop distance."],["Scalping","Very short trades lasting seconds to minutes for small gains. Spread matters a lot."],["Day trading","Opening and closing trades within the same day."],["Swing trading","Holding trades for days to weeks."],["Commission","Per-trade fee some accounts charge on top of a tight spread."],["Rollover","Daily cutoff, around 5 pm New York, when swaps apply and spreads widen."],["Gap","Price jump between one candle's close and the next open, common after weekends."],["Volatility","How much and how fast price moves."],["Base / quote currency","In EURUSD, EUR is the base and USD the quote. The price is how many USD one EUR costs."],["Major pair","Currency pair with USD and another heavily traded currency, like EURUSD."],["Cross pair","Pair without USD, such as EURGBP."],["Exotic pair","A major currency against an emerging-market one. Usually wider spreads."],["CFD","Contract for difference: you trade price changes without owning the asset."],["Forex","The market for exchanging currencies."],["Broker","Company that gives you access to the market."],["ECN account","Account with raw spreads where you usually pay a commission per trade."],["Market maker","Broker that quotes prices and may take the other side of your trades."],["Tick","Smallest price change the platform shows."],["Pipette","Fifth decimal on most pairs, a tenth of a pip."],["Contract size","Units in one lot, for example 100,000 for EURUSD or 100 ounces for gold."],["Candlestick","Chart bar showing open, high, low and close for one period."],["Doji","Candle whose open and close are almost equal."],["Pin bar / hammer","Small body with a long wick, showing rejection."],["Engulfing candle","Candle whose body fully covers the previous candle's body."],["Marubozu","Candle with a big body and almost no wicks."],["Consolidation","Tight sideways price action, often before a bigger move."],["Breakout","Price closing beyond a level or range."],["Fakeout","A breakout that fails and reverses."],["Pullback / retracement","A partial move against the prevailing move."],["Trendline","Line through swing lows in an uptrend or swing highs in a downtrend."],["Channel","Two parallel trendlines containing price."],["Fibonacci retracement","Tool marking common pullback depths such as 50% and 61.8% of a move."],["Divergence","Price makes a new high or low but an indicator does not."],["Overbought / oversold","RSI above 70 / below 30. It may or may not mean a reversal."],["EMA / SMA","Exponential / simple moving average. EMA gives recent prices more weight."],["Bollinger Bands","Bands set two standard deviations around a moving average."],["MACD","Momentum indicator built from the gap between two moving averages."],["Volume","Number of trades in a period. In forex and CFDs it is usually tick volume."],["Price action","Reading price movement itself rather than relying on indicators."],["Market structure","The sequence of swing highs and lows."],["Equilibrium","Midpoint (50%) of a range or a move."],["Premium / discount","Upper half / lower half of a range. The idea is to buy cheap and sell expensive."],["Inducement","A minor level said to trap traders before the real move."],["Imbalance","Area where price moved so fast one way that little two-way trading happened."],["Mitigation","Price returning to a zone to use up its remaining orders."],["Breaker block","An order block that failed and flipped role."],["Supply / demand zone","Area where selling / buying pushed price away sharply."],["Confluence","Several independent reasons agreeing at the same spot."],["Higher timeframe (HTF)","A larger chart, like 4-hour or daily, used for direction."],["Killzone","Time window, such as the London open, that some traders believe is most active."],["London / New York / Asian session","The main trading periods. London and New York overlap is usually the busiest."],["Bullish / bearish","Expecting price to rise / fall."],["Bull / bear market","A broad rising / falling market."],["Hawkish / dovish","Central bank leaning toward higher / lower interest rates."],["Interest rate","Cost of borrowing set by a central bank. A major driver of currencies."],["Inflation","Rise in prices over time, watched closely by central banks."],["Central bank","Institution that sets interest rates, such as the US Federal Reserve."],["NFP","US Non-Farm Payrolls jobs report, released the first Friday of the month."],["CPI","Consumer Price Index, a main inflation measure."],["FOMC","US Federal Reserve committee that decides interest rates."],["Economic calendar","Schedule of data releases and central bank events."],["Safe haven","Asset people buy in fear, such as gold, USD, JPY and CHF."],["Risk-on / risk-off","Mood of buying risky assets versus fleeing to safety."],["FOMO","Fear of missing out. Chasing a trade after the move."],["Revenge trading","Trading emotionally to win back a loss."],["Overtrading","Taking too many trades or trades that are too large."],["Trading plan","Written rules for setups, risk and routine."],["Edge","A repeatable advantage that makes money after costs."],["Confirmation bias","Noticing only evidence that agrees with your view."],["Sample size","Number of trades behind a result. Small samples mislead."],["Out-of-sample","Data you did not use while designing the strategy."],["Forward test","Trading the rules in real time, usually on demo, after backtesting."],["Curve fitting","Another name for overfitting."]);
/* ============ views ============ */
const done=()=>store.get('tz.done',{});

/* ============ practice simulator ============ */
function W_practice(box){
  const PIP=.0001,SPREAD=1.2;
  let bal=store.get('tz.simbal',1000),risk=1,pos=null,auto=null,msg='',price=1.085,reg={left:0},cs=[],news={};
  const R=Math.random,N=()=>{let u=0;for(let i=0;i<6;i++)u+=R();return(u-3)/Math.sqrt(.5)};
  function nxt(){
    if(reg.left<=0){reg={t:['up','down','range','range'][Math.floor(R()*4)],left:25+Math.floor(R()*40),vol:4+R()*4,c:price}}
    reg.left--;
    const o=price,d=reg.t==='up'?1.3:reg.t==='down'?-1.3:(reg.c-o)/PIP*.12,nw=R()<.03,vol=reg.vol*(nw?4:1),c=o+(d+N()*vol)*PIP;
    price=c;cs.push([o,Math.max(o,c)+R()*vol*.6*PIP,Math.min(o,c)-R()*vol*.6*PIP,c]);
    if(nw)news[cs.length-1]=1;
    return nw;
  }
  for(let i=0;i<60;i++)nxt();
  box.innerHTML=`<p class="mute" style="font-size:14.5px">A simulated market: trends, ranges and news spikes arrive in random order, so you cannot memorise it. It trains execution and risk, not prediction. Run your checklist before every trade.</p>
  <div class="w" id="hd"></div><div id="ch" style="margin-top:14px"></div>
  <div class="rp" style="gap:8px"><button class="btn sm" id="au" type="button">Auto</button><button class="btn pri sm" id="nx" type="button">Next candle</button></div>
  <div class="w" id="od" style="margin-top:14px"></div><div id="ms" style="margin-top:14px"></div><div class="w" id="st" style="margin-top:14px"></div>`;
  const pl=()=>pos?(price-pos.fill)/PIP*pos.dir*10*pos.lots:0;
  function head(){
    const o=pl();
    $('#hd',box).innerHTML=`<div style="display:flex;justify-content:space-between;gap:10px"><div><div class="mute" style="font-size:14px">Balance</div><div class="big">${fmt$(bal)}</div></div><div style="text-align:right"><div class="mute" style="font-size:14px">Price</div><div class="big" style="font-size:28px">${price.toFixed(5)}</div></div></div>${pos?`<div class="out"><p>${pos.dir>0?'Long':'Short'} ${pos.lots.toFixed(2)} lots · open result <b class="${o>=0?'good':'bad'}">${o>=0?'+':''}${fmt$(o)}</b></p></div>`:''}`;
  }
  function pic(){
    const v=cs.slice(-60),off=cs.length-v.length,notes=[];
    Object.keys(news).forEach(k=>{const i=k-off;if(i>=0&&i<v.length)notes.push({type:'vline',i,label:'News',color:MUTE})});
    if(pos){notes.push({type:'hline',y:pos.fill,label:'Entry',color:INK,dash:'2 3'},{type:'hline',y:pos.sl,label:'Stop',color:DNC},{type:'hline',y:pos.tp,label:'Target',color:UPC})}
    chart($('#ch',box),{candles:v,notes,static:true,h:260,extra:1,alt:'Simulated price chart'});
  }
  function stats(){
    const J=store.get('tz.journal',[]).filter(j=>(j.s||'').startsWith('Practice')),n=J.length,w=J.filter(j=>j.r>0).length,t=J.reduce((a,j)=>a+j.r,0);
    $('#st',box).innerHTML=`<p style="margin:0 0 6px"><b>Practice record</b></p><p class="mute" style="margin:0 0 10px">${n?`${n} trades · win rate <b>${Math.round(w/n*100)}%</b> · average <b class="${t>=0?'good':'bad'}">${(t/n).toFixed(2)} R</b>`:'No practice trades yet.'}</p><p class="mute" style="font-size:14px;margin:0 0 10px">Every closed trade is also saved to your journal. Under 30 trades the stats are mostly noise.</p><button class="btn ghost" id="rs" type="button" style="min-height:40px;font-size:14px">Reset balance to $1,000</button>`;
    let arm=false;const r=$('#rs',box);r.onclick=()=>{if(!arm){arm=true;r.textContent='Tap again to reset';return}bal=1000;store.set('tz.simbal',1000);pos=null;msg='Balance reset.';stopAuto();all()};
  }
  function order(){
    const od=$('#od',box);
    if(pos){od.innerHTML=`<p style="margin:0 0 4px"><b>${pos.dir>0?'Long':'Short'} open</b></p><p class="mute" style="margin:0 0 12px;font-size:14.5px">Stop ${pos.stopP} pips · target ${pos.tgtP} pips · risking ${fmt$(pos.riskUSD)}. Spread of ${SPREAD} pips was charged at entry.</p><button class="btn" id="cl" type="button" style="width:100%">Close now</button>`;$('#cl',box).onclick=()=>closeAt(price,'Closed by you');return}
    od.innerHTML=`<label>Risk per trade</label><div id="rc"></div><div class="row2"><div><label>Stop (pips)</label><input id="sp" type="number" inputmode="decimal" value="20"></div><div><label>Target (pips)</label><input id="tg" type="number" inputmode="decimal" value="30"></div></div><div class="out" id="pv"></div><div class="row2" style="margin-top:12px"><button class="buy" id="by" type="button">Buy</button><button class="sell" id="sl" type="button">Sell</button></div>`;
    $('#rc',box).append(chips(['0.5%','1%','2%'],[.5,1,2].indexOf(risk),i=>{risk=[.5,1,2][i];prev()}));
    const size=()=>{const s=+$('#sp',box).value||0,r=bal*risk/100,l=s>0?Math.floor(r/(s*10)*100+1e-9)/100:0;return{s,r,l}};
    function prev(){const{s,r,l}=size();$('#pv',box).innerHTML=!s?'<p class="mute">Enter a stop distance.</p>':l<.01?'<p class="bad">Stop too wide for this risk and balance.</p>':`<p>Risk <b>${fmt$(r)}</b> → <b>${l.toFixed(2)} lots</b></p><p class="mute" style="font-size:14px">Reward at target: about ${fmt$(l*(+$('#tg',box).value||0)*10)}</p>`}
    $('#sp',box).oninput=prev;$('#tg',box).oninput=prev;prev();
    const go=d=>{const{s,l}=size(),t=+$('#tg',box).value||0;if(bal<=0){msg='Account empty. Reset the balance.';ms();return}if(!s||!t||l<.01)return;
      const fill=price+d*SPREAD*PIP;pos={dir:d,fill,sl:fill-d*s*PIP,tp:fill+d*t*PIP,lots:l,stopP:s,tgtP:t,riskUSD:l*s*10};msg='';all()};
    $('#by',box).onclick=()=>go(1);$('#sl',box).onclick=()=>go(-1);
  }
  function ms(){$('#ms',box).innerHTML=msg?`<div class="note ${/Stop|empty/.test(msg)?'warn':''}"><b>${msg}</b></div>`:''}
  function closeAt(x,why){
    const p=(x-pos.fill)/PIP*pos.dir,pnl=p*10*pos.lots,r=pnl/pos.riskUSD;
    bal+=pnl;store.set('tz.simbal',bal);
    const J=store.get('tz.journal',[]);J.push({s:'Practice '+(pos.dir>0?'buy':'sell'),r:Math.round(r*100)/100,n:why});store.set('tz.journal',J);
    msg=`${why}: ${pnl>=0?'+':''}${fmt$(pnl)} (${r>=0?'+':''}${r.toFixed(1)}R)`+(bal<=0?'. Account empty, reset the balance to keep practising.':'');
    pos=null;if(bal<=0)stopAuto();all();
  }
  function step(){
    const nw=nxt(),c=cs[cs.length-1];
    if(pos){let ex=null,why='',slip=nw?3*PIP:0;
      if(pos.dir>0){if(c[2]<=pos.sl){ex=pos.sl-slip;why='Stop hit'}else if(c[1]>=pos.tp){ex=pos.tp;why='Target hit'}}
      else{if(c[1]>=pos.sl){ex=pos.sl+slip;why='Stop hit'}else if(c[2]<=pos.tp){ex=pos.tp;why='Target hit'}}
      if(ex!=null){closeAt(ex,why+(why==='Stop hit'&&nw?' (slipped on news)':''));return}}
    if(nw){msg='News spike. Spreads widen and stops can slip.';}else if(!pos&&msg&&!/Balance reset|empty/.test(msg)){}
    head();pic();ms();
  }
  function stopAuto(){clearInterval(auto);auto=null;const b=$('#au',box);if(b)b.textContent='Auto'}
  function all(){head();pic();order();ms();stats()}
  $('#nx',box).onclick=()=>{msg=msg&&/News/.test(msg)?'':msg;step()};
  $('#au',box).onclick=()=>{if(auto){stopAuto();return}$('#au',box).textContent='Pause';auto=setInterval(()=>{if(bal<=0){stopAuto();return}step()},900)};
  onLeave(()=>clearInterval(auto));
  all();
}
function home(){
  leave();window.scrollTo(0,0);
  const D=done(),cnt=MODS.filter((_,i)=>D['m'+i]!=null).length;
  app.innerHTML=`<header class="hero"><div class="brand"><div class="logo"><img src="${LOGO}" alt="App icon"></div><h1>Trading,<br>from zero</h1></div><div class="strip" id="strip"></div><p>Ten short modules, in order. Charts you can replay, tools you can use, and no hype. ${cnt?`${cnt} of 10 done.`:''}</p></header><ol class="mods">${MODS.map((m,i)=>`<li><a href="#" data-m="${i}"><span class="n">${i+1}</span><span class="t">${m.t}<small>${m.min} min · ${m.sub}</small></span>${D['m'+i]!=null?'<span class="ok">✓</span>':'<span class="go">›</span>'}</a></li>`).join('')}</ol><div class="sub">Tools</div><ol class="mods"><li><a href="#" data-t="practice"><span class="t">Practice trading<small>Simulated market, risk-managed</small></span><span class="go">›</span></a></li><li><a href="#" data-t="calc"><span class="t">Position size calculator</span><span class="go">›</span></a></li><li><a href="#" data-t="journal"><span class="t">Trade journal</span><span class="go">›</span></a></li><li><a href="#" data-t="gloss"><span class="t">Glossary</span><span class="go">›</span></a></li></ol><p class="foot">Education only, not financial advice. Most retail traders lose money.</p>`;
  chart($('#strip'),{candles:gen(3,40,50,.28,1.3),bare:true,h:92,from:1,speed:70,alt:'Candles drawing themselves'});
  $$('[data-m]').forEach(a=>a.onclick=e=>{e.preventDefault();lesson(+a.dataset.m,0)});
  $$('[data-t]').forEach(a=>a.onclick=e=>{e.preventDefault();tool(a.dataset.t)});
}
function lesson(mi,si){
  leave();window.scrollTo(0,0);
  const M=MODS[mi],S=M.screens[si],last=si===M.screens.length-1;
  app.innerHTML=`<div class="top"><button class="back" aria-label="Back to modules" type="button">‹</button><div class="seg">${M.screens.map((_,i)=>`<i class="${i<si?'d':i===si?'c':''}"></i>`).join('')}</div></div><main class="scr"><h2>${S.t}</h2><div class="viz"></div>${S.html||''}</main><footer class="nav"><div>${si?'<button class="btn ghost" id="pv" type="button">Back</button>':''}<button class="btn pri" id="nx" type="button">${last?'Take the quiz':'Next'}</button></div></footer>`;
  if(S.viz)S.viz($('.viz'));
  $('.back').onclick=home;
  if(si)$('#pv').onclick=()=>lesson(mi,si-1);
  $('#nx').onclick=()=>last?quiz(mi):lesson(mi,si+1);
}
function quiz(mi){
  leave();window.scrollTo(0,0);
  const M=MODS[mi];let qi=0,score=0;
  const show=()=>{
    if(qi>=M.quiz.length)return finish();
    const Q=M.quiz[qi];
    app.innerHTML=`<div class="top"><button class="back" aria-label="Back to lesson" type="button">‹</button><div class="seg">${M.quiz.map((_,i)=>`<i class="${i<qi?'d':i===qi?'c':''}"></i>`).join('')}</div></div><main class="scr"><div class="q">${Q.q}</div><div id="os">${Q.o.map((t,i)=>`<button class="opt" data-i="${i}" type="button">${t}</button>`).join('')}</div><div id="fb"></div></main>`;
    $('.back').onclick=()=>lesson(mi,M.screens.length-1);
    $$('.opt').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i;if(i===Q.a)score++;
      $$('.opt').forEach(x=>{x.disabled=true;const j=+x.dataset.i;if(j===Q.a)x.classList.add('right');else if(j===i)x.classList.add('wrong')});
      $('#fb').innerHTML=`<p style="margin-top:6px"><b class="${i===Q.a?'good':'bad'}">${i===Q.a?'Correct.':'Not quite.'}</b> ${Q.why}</p><button class="btn pri" id="nq" type="button" style="width:100%;margin-top:6px">${qi===M.quiz.length-1?'See result':'Next question'}</button>`;
      $('#nq').onclick=()=>{qi++;show()};$('#nq').scrollIntoView({block:'end',behavior:'smooth'});
    });
  };
  const finish=()=>{
    const pass=score>=2;if(pass){const D=done();D['m'+mi]=Math.max(D['m'+mi]||0,score);store.set('tz.done',D)}
    app.innerHTML=`<div class="top"><button class="back" aria-label="Home" type="button">‹</button></div><main class="scr"><h2>${score} of ${M.quiz.length}</h2><p>${pass?'Module complete.':'Review the lesson and try again. Two correct answers marks it complete.'}</p><div style="display:flex;gap:10px;margin-top:20px"><button class="btn" id="rv" type="button">${pass?'Review':'Review lesson'}</button><button class="btn pri" id="ct" type="button">${pass&&mi<MODS.length-1?'Next module':'Home'}</button></div></main>`;
    $('.back').onclick=home;$('#rv').onclick=()=>lesson(mi,0);
    $('#ct').onclick=()=>pass&&mi<MODS.length-1?lesson(mi+1,0):home();
  };
  show();
}
function tool(name){
  leave();window.scrollTo(0,0);
  const T={practice:['Practice trading',W_practice],calc:['Position size calculator',W_calc],journal:['Trade journal',W_journal],gloss:['Glossary',null]}[name];
  app.innerHTML=`<div class="top"><button class="back" aria-label="Home" type="button">‹</button></div><main class="scr"><h2>${T[0]}</h2><div id="tb"></div></main>`;
  $('.back').onclick=home;
  if(T[1])T[1]($('#tb'));
  else{
    $('#tb').innerHTML=`<input class="search" id="q" type="search" placeholder="Search terms" aria-label="Search glossary"><dl class="gl" id="gl"></dl>`;
    const draw=f=>{$('#gl').innerHTML=GLOSS.slice().sort((x,y)=>x[0].localeCompare(y[0])).filter(([a,b])=>(a+' '+b).toLowerCase().includes(f)).map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('')||'<p class="mute">No match.</p>'};
    $('#q').oninput=e=>draw(e.target.value.toLowerCase());draw('');
  }
}
home();
</script>
